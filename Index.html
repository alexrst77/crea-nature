const state={quotes:JSON.parse(localStorage.cn_quotes||'[]'),clients:JSON.parse(localStorage.cn_clients||'[]'),settings:JSON.parse(localStorage.cn_settings||'{"hour":60,"margin":30,"tva":20}')};
function svg(name){return `<svg viewBox="0 0 24 24" fill="none">${icons[name]}</svg>`}function euro(n){return Number(n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0})}function save(){localStorage.cn_quotes=JSON.stringify(state.quotes);localStorage.cn_clients=JSON.stringify(state.clients);localStorage.cn_settings=JSON.stringify(state.settings)}
function renderNav(){nav.innerHTML=navItems.map(([id,label,ic,b])=>`<button class="${id==='accueil'?'active':''}" onclick="openScreen('${id}')">${svg(ic)}<span>${label}</span>${b?`<span class="badge">${b}</span>`:''}</button>`).join('');mobilebar.innerHTML=navItems.slice(0,5).map(([id,label,ic])=>`<button class="${id==='accueil'?'active':''}" onclick="openScreen('${id}')">${svg(ic)}<span>${label.split(' ')[0]}</span></button>`).join('')}
function openScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button,.mobilebar button').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick').includes(`'${id}'`)));document.querySelector('.main').scrollTo({top:0,behavior:'smooth'});}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}function toggleCompact(){document.body.classList.toggle('compact');toast('Affichage changé')}
function quickSearch(v){if(v.length>2)toast('Recherche locale : '+v)}
function screenAccueil(){return `<div class="grid-kpi"><div class="card kpi"><div class="mini-icon">${svg('analytics')}</div><div class="kpi-title">Chiffre d'affaires</div><div class="kpi-value">28 540 €</div><div class="kpi-sub positive">+12.4% vs mois dernier</div><div class="spark"></div></div><div class="card kpi"><div class="mini-icon goldi">${svg('devis')}</div><div class="kpi-title">Devis en attente</div><div class="kpi-value">7</div><div class="kpi-sub gold">12 860 € · 3 à relancer</div></div><div class="card kpi"><div class="mini-icon">${svg('planning')}</div><div class="kpi-title">Chantiers à planifier</div><div class="kpi-value">5</div><div class="kpi-sub">Cette semaine</div></div><div class="card kpi"><div class="mini-icon goldi">${svg('analytics')}</div><div class="kpi-title">Marge estimée</div><div class="kpi-value">8 420 €</div><div class="kpi-sub positive">29.6% du CA</div></div></div><div class="layout"><div class="card chart-card"><div class="section-title"><h2>CA des 12 derniers mois</h2><small>28 540 € · Avril 2026</small></div><div class="bars">${[38,61,43,56,47,55,75,58,52,68,56,76].map((h,i)=>`<div class="bar" style="height:${h}%"><span>${['Mai','Juin','Juil.','Août','Sept.','Oct.','Nov.','Déc.','Janv.','Fév.','Mars','Avr.'][i]}</span></div>`).join('')}</div></div><div class="card chart-card"><div class="section-title"><h2>Répartition du CA</h2></div><div class="donut-wrap"><div class="donut"></div><div class="legend">${[['Entretien','12 450 €','43.6%', 'var(--purple)'],['Création','7 860 €','27.6%','var(--green)'],['Élagage','4 230 €','14.8%','var(--orange)'],['Terrasse / Bois','2 850 €','10.0%','var(--blue)'],['Autres','1 150 €','4.0%','#8b8f9c']].map(r=>`<div class="legend-row"><i class="dot" style="background:${r[3]}"></i><span>${r[0]}</span><strong>${r[1]}</strong><em>${r[2]}</em></div>`).join('')}</div></div></div><div class="card list-card"><div class="section-title"><h2>Alertes & rappels</h2></div>${alerts()}</div><div class="card list-card"><div class="section-title"><h2>Prochains chantiers</h2><small onclick="openScreen('planning')">Voir planning</small></div>${chantiersList()}</div><div class="card ia-card"><div class="section-title"><h2>Assistant devis IA <small class="pill blue">Nouveau</small></h2></div>${iaBlock()}</div><div class="card quick-card"><div class="section-title"><h2>Accès rapide</h2></div><div class="quick-grid">${quickBtns()}</div></div><div class="card table-card"><div class="section-title"><h2>Derniers devis</h2><small onclick="openScreen('devis')">Voir tous</small></div>${quoteTable()}</div><div class="card weather-card"><div class="section-title"><h2>Météo locale</h2><small>Nantes, 44</small></div>${weather()}</div></div>`}
function alerts(){return [['3 devis en attente depuis +7 jours','Relancez vos clients pour augmenter vos chances','orange-bg'],['5 chantiers à planifier cette semaine','Optimisez votre planning','purple-bg'],['2 contrats d’entretien à renouveler','Clients fidèles à recontacter','gold-bg']].map(a=>`<div class="alert"><div class="aicon ${a[2]}">!</div><div><strong>${a[0]}</strong><p>${a[1]}</p></div></div>`).join('')}function chantiersList(){return [['VEN. 23','Dupont Marc','Taille haie + évacuation','Confirmé','ok'],['SAM. 24','Leroy Sophie','Entretien jardin','À confirmer','wait'],['MAR. 27','Moreau Julien','Création massif + plantation','Confirmé','ok'],['MER. 28','Bernard Paul','Élagage arbre + évacuation','En attente','blue']].map(c=>`<div class="chantier"><div class="date"><small>${c[0].split(' ')[0]}</small>${c[0].split(' ')[1]}</div><div><h3>${c[1]}</h3><p>${c[2]} · 08:30</p></div><span class="pill ${c[4]}">${c[3]}</span></div>`).join('')}
function iaBlock(){return `<div class="ia-input"><textarea id="aiText" placeholder="Ex : Taille de haie 34m, 2 gars, 4h, évacuation comprise..."></textarea><button class="send" onclick="generateQuote()">✦</button></div><div class="chips">${['Taille haie 30m','Tonte 500m²','Élagage 1 arbre','Terrasse bois 20m²','Nettoyage terrain','Massif fleuri','Arrosage automatique'].map(x=>`<button class="chip" onclick="document.getElementById('aiText').value='${x}'">${x}</button>`).join('')}</div><div class="settings-mini"><div class="mini-setting"><span>Tarif horaire</span><strong>${state.settings.hour}€</strong><span>/ heure / ouvrier</span></div><div class="mini-setting"><span>Marge cible</span><strong>${state.settings.margin}%</strong><span>Recommandée</span></div><div class="mini-setting"><span>TVA défaut</span><strong>${state.settings.tva}%</strong><span>Modifiable</span></div></div><button class="btn-primary" onclick="generateQuote()">Créer un devis IA</button>`}
function quickBtns(){return [['Nouveau devis','devis','devis'],['Nouveau chantier','chantiers','chantiers'],['Nouveau client','clients','clients'],['Bibliothèque','bibliotheque','bibliotheque'],['Planning','planning','planning'],['Assistant IA','devis','devis'],['Facture','factures','factures'],['Mail client','messages','messages'],['Rapport activité','analytics','analytics']].map(q=>`<button class="quick" onclick="openScreen('${q[1]}')">${svg(q[2])}<span>${q[0]}</span></button>`).join('')}
function quoteTable(){let rows=state.quotes.slice(-5).reverse();if(!rows.length)rows=[{id:'DEV-2026-042',client:'Durand Éric',total:3450,status:'En attente',date:'22/05/2026'},{id:'DEV-2026-041',client:'Martin Julie',total:1280,status:'Envoyé',date:'21/05/2026'},{id:'DEV-2026-040',client:'Leroy Sophie',total:2950,status:'Signé',date:'20/05/2026'}];return `<table class="table"><thead><tr><th>N° devis</th><th>Client</th><th>Montant</th><th>Statut</th><th>Date</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="purple">${r.id}</td><td><strong>${r.client}</strong></td><td>${euro(r.total)}</td><td><span class="pill ${r.status==='Signé'?'ok':r.status==='Envoyé'?'blue':'wait'}">${r.status}</span></td><td>${r.date}</td></tr>`).join('')}</tbody></table>`}
function weather(){return `<div class="weather-main"><div><div class="temp">18°C</div><p>Ensoleillé</p><p class="kpi-sub">Vent 12 km/h · Humidité 65%</p></div><div class="sun"></div></div><div class="forecast">${['VEN.','SAM.','DIM.','LUN.','MAR.'].map((d,i)=>`<div class="day"><strong>${d}</strong><div style="font-size:25px;margin:8px">${i===2||i===3?'☁️':'☀️'}</div><span>${i===3?'16° / 7°':'18° / 8°'}</span></div>`).join('')}</div>`}
function screenDevis(){return `<div class="layout"><div class="card ia-card span2"><div class="section-title"><h2>Créateur de devis intelligent</h2><small>Mode rapide terrain</small></div>${iaBlock()}</div><div class="card list-card"><div class="section-title"><h2>Détails du devis</h2></div><div class="form-grid"><div class="field"><label>Client</label><input id="qClient" placeholder="Nom du client"></div><div class="field"><label>Prestation</label><select id="qType"><option>Taille de haie</option><option>Tonte</option><option>Terrasse bois</option><option>Massif / plantation</option><option>Élagage</option><option>Nettoyage terrain</option><option>Traitement toiture</option></select></div><div class="field"><label>Ouvriers</label><input id="qWorkers" type="number" value="2" oninput="calcQuote()"></div><div class="field"><label>Heures</label><input id="qHours" type="number" value="4" oninput="calcQuote()"></div><div class="field"><label>Fournitures HT</label><input id="qSupplies" type="number" value="0" oninput="calcQuote()"></div><div class="field"><label>Déplacement HT</label><input id="qTravel" type="number" value="35" oninput="calcQuote()"></div><div class="field"><label>TVA</label><select id="qTva" onchange="calcQuote()"><option value="10">10%</option><option value="20" selected>20%</option></select></div><div class="field"><label>Marge cible</label><input id="qMargin" type="number" value="30" oninput="calcQuote()"></div><div class="field full"><label>Note chantier</label><textarea id="qNote" placeholder="Accès, évacuation, contraintes, matériel..."></textarea></div></div></div><div class="card list-card"><div class="section-title"><h2>Prévisualisation</h2></div><div class="quote-box"><h3 id="prevTitle">Devis taille de haie</h3><p class="kpi-sub" id="prevDesc">Main-d’œuvre + déplacement + TVA</p><div class="big-number" id="prevTotal">0 €</div><p class="kpi-sub" id="prevMargin">Marge estimée : 0 €</p><button class="btn-primary" style="margin-top:16px" onclick="saveQuote()">Enregistrer le devis</button></div></div><div class="card table-card span2"><div class="section-title"><h2>Historique devis</h2></div>${quoteTable()}</div></div>`}
function calcQuote(){const w=+qWorkers.value||0,h=+qHours.value||0,s=+qSupplies.value||0,t=+qTravel.value||0,tva=+qTva.value||0,m=+qMargin.value||0;const cost=w*h*state.settings.hour+s+t;const ht=cost*(1+m/100);const total=ht*(1+tva/100);prevTitle.textContent='Devis '+qType.value.toLowerCase();prevTotal.textContent=euro(total);prevMargin.textContent='Marge estimée : '+euro(ht-cost);return {cost,ht,total}}
function generateQuote(){let txt=(document.getElementById('aiText')||{}).value||'Taille haie 30m, 2 gars, 4h';openScreen('devis');setTimeout(()=>{qNote.value=txt;qClient.value=qClient.value||'Client à compléter';qType.value=txt.toLowerCase().includes('terrasse')?'Terrasse bois':txt.toLowerCase().includes('tonte')?'Tonte':txt.toLowerCase().includes('massif')?'Massif / plantation':txt.toLowerCase().includes('toiture')?'Traitement toiture':'Taille de haie';let nums=txt.match(/\d+/g)||[];qHours.value=txt.toLowerCase().includes('journ')?7:(nums.includes('4')?4:4);qWorkers.value=txt.includes('2')||txt.includes('gars')?2:1;calcQuote();toast('Devis prérempli depuis la demande')},50)}
function saveQuote(){const c=calcQuote();const id='DEV-2026-'+String(43+state.quotes.length).padStart(3,'0');state.quotes.push({id,client:qClient.value||'Client sans nom',total:c.total,status:'En attente',date:new Date().toLocaleDateString('fr-FR')});save();renderAll();openScreen('devis');toast('Devis enregistré localement')}
function basicScreen(title,desc,content=''){return `<div class="card list-card"><div class="section-title"><h2>${title}</h2><small>${desc}</small></div>${content}</div>`}
function screenChantiers(){return `<div class="layout"><div class="card list-card"><div class="section-title"><h2>Mode chantier</h2><small>Avant / après / notes</small></div><div class="form-grid"><div class="field full"><label>Client</label><input placeholder="Nom client"></div><div class="field full"><label>Adresse</label><input placeholder="Adresse chantier"></div><div class="field"><label>Début</label><input type="time" value="08:30"></div><div class="field"><label>Fin</label><input type="time" value="17:00"></div><div class="field full"><label>Notes terrain</label><textarea placeholder="Accès, déchets, matériel, photos à ajouter..."></textarea></div></div><button class="btn-primary" style="margin-top:14px" onclick="toast('Fiche chantier créée')">Créer fiche chantier</button></div><div class="card list-card"><div class="section-title"><h2>Chantiers actifs</h2></div>${chantiersList()}</div></div>`}
function screenPlanning(){return basicScreen('Planning intelligent','Regroupement par ville / semaine',`<div class="grid-kpi"><div class="card kpi"><div class="kpi-title">Cette semaine</div><div class="kpi-value">5</div><div class="kpi-sub">chantiers</div></div><div class="card kpi"><div class="kpi-title">Heures prévues</div><div class="kpi-value">37h</div><div class="kpi-sub">2 ouvriers</div></div></div>${chantiersList()}`)}
function screenClients(){return basicScreen('Clients','Base locale simple',`<div class="form-grid"><div class="field"><label>Nom</label><input id="clientName" placeholder="Nom client"></div><div class="field"><label>Téléphone</label><input id="clientPhone" placeholder="06..."></div><div class="field full"><label>Adresse</label><input id="clientAddress" placeholder="Adresse"></div></div><button class="btn-primary" style="margin-top:14px" onclick="addClient()">Ajouter client</button><div style="margin-top:20px">${clientList()}</div>`)}function addClient(){state.clients.push({name:clientName.value||'Client sans nom',phone:clientPhone.value,address:clientAddress.value});save();renderAll();openScreen('clients');toast('Client ajouté')}function clientList(){return (state.clients.length?state.clients:[{name:'Dupont Marc',phone:'06 00 00 00 00',address:'Nantes'}]).map(c=>`<div class="alert"><div class="aicon purple-bg">${c.name[0]}</div><div><strong>${c.name}</strong><p>${c.phone||''} · ${c.address||''}</p></div></div>`).join('')}
function screenBiblio(){let s=[['Taille de haie','60€/h','Échelle, taille-haie, évacuation'],['Terrasse bois','180-280€/m²','Plots, lambourdes, lames, géotextile'],['Massif paysager','90-180€/m²','Terre, plantes, paillage, bordures'],['Nettoyage terrain','Sur devis','Débroussaillage, évacuation, remise propre'],['Traitement toiture','8-15€/m²','Fongicide par projection'],['Arrosage automatique','Sur devis','Programmateur, électrovannes, buses']];return `<div class="cards-grid">${s.map(x=>`<div class="card service-card"><h3>${x[0]}</h3><p>${x[2]}</p><div class="service-meta"><span>${x[1]}</span><button class="chip" onclick="openScreen('devis')">Devis</button></div></div>`).join('')}</div>`}
function screenSettings(){return basicScreen('Réglages','Tarifs par défaut',`<div class="form-grid"><div class="field"><label>Tarif horaire</label><input id="sHour" type="number" value="${state.settings.hour}"></div><div class="field"><label>Marge cible</label><input id="sMargin" type="number" value="${state.settings.margin}"></div><div class="field"><label>TVA par défaut</label><input id="sTva" type="number" value="${state.settings.tva}"></div></div><button class="btn-primary" style="margin-top:14px" onclick="state.settings={hour:+sHour.value,margin:+sMargin.value,tva:+sTva.value};save();renderAll();openScreen('reglages');toast('Réglages sauvegardés')">Sauvegarder</button><p class="kpi-sub" style="margin-top:16px">Version statique prête pour GitHub Pages. Les données sont stockées dans le navigateur avec localStorage.</p>`)}
function renderAll(){accueil.innerHTML=screenAccueil();devis.innerHTML=screenDevis();chantiers.innerHTML=screenChantiers();planning.innerHTML=screenPlanning();clients.innerHTML=screenClients();bibliotheque.innerHTML=screenBiblio();factures.innerHTML=basicScreen('Factures','À brancher ensuite sur devis signés',quoteTable());analytics.innerHTML=basicScreen('Analytiques','CA, marge, taux de signature',screenAccueil().split('<div class="layout">')[0]);messages.innerHTML=basicScreen('Messages','Modèles de relance client',`<div class="quote-box"><h3>Relance devis</h3><p>Bonjour, je me permets de revenir vers vous concernant le devis envoyé. Dites-moi si vous souhaitez que je bloque une date d’intervention.</p></div>`);reglages.innerHTML=screenSettings();setTimeout(()=>{if(window.qWorkers)calcQuote()},0)}
renderNav();renderAll();
</script>
</body>
</html>
